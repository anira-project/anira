name: clang_format

on:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.2
      - uses: tanh-lab/ci-actions/clang-format-check@v0.2.2
        with:
          SOURCES: "src/ include/ test/ examples/"

  # The queue's required status for this workflow.
  result:
    name: clang_format result
    needs: [format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.format.result }}" = "success" ] || exit 1
