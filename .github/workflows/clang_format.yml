name: clang_format

on:
  # PR runs are stubs: only the result job reports (queue entry requires it);
  # the real jobs run in the merge queue.
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.3
      - uses: tanh-lab/ci-actions/clang-format-check@v0.3.3
        with:
          SOURCES: "src/ include/ test/ examples/"

  # The queue's required status for this workflow.
  result:
    name: clang_format result
    needs: [format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: the real jobs run in the merge queue"; exit 0; }
          [ "${{ needs.format.result }}" = "success" ] || exit 1
