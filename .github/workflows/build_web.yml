name: build_web

# The wasm build runs through the shared cmake-build-wasm action — the emsdk
# pin lives there, shared across tanh-lab repos. The JS/TS npm package build
# that follows is anira product code and stays here, in the same job, because
# it consumes the wasm build outputs.

on:
  workflow_dispatch:
  merge_group:
  pull_request:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # The committed C ABI files (headers, enums.ts, symbol lists, layout test) must
      # match abi/anira.yml; this workflow has no path filter, so every PR gets it.
      - name: check the generated C ABI files against abi/anira.yml
        run: |
          python3 -m pip install --user pyyaml
          python3 tools/abi/gen.py --repo . --check

      # emcc emits the .d.ts during the build (--emit-tsd), so the pin must
      # precede it.
      - name: pin global typescript for emscripten --emit-tsd
        run: |
          sudo npm i -g typescript@5.9
          which tsc
          tsc --version

      # wasm-abi is wasm-release (the module the package ships) plus ANIRA_WITH_ABI_TESTS:
      # the ABI gates that run under node, in the same build.
      - name: build wasm
        uses: tanh-lab/ci-actions/cmake-build-wasm@v0.3.16
        with:
          PRESET: wasm-abi

      # Gate 3's layout table on wasm32, diffed against abi/layout-0.txt, and the node smoke
      # of anira/anira_em.h's trampolines (test/abi/CMakeLists.txt, its Wasm arm). node is
      # emsdk's, the CMAKE_CROSSCOMPILING_EMULATOR of the configure.
      - name: run the WebAssembly ABI gates under node
        run: cmake --build --preset wasm-abi --target anira_abi_wasm_gates

      # The module exports exactly the promised, draft and Emscripten entry points (and
      # _malloc, _free), read from the typing emcc emitted: a name of the lists missing from
      # the link, or an export no list has, fails the job.
      - name: check the exports of AniraWeb against the symbol lists
        run: |
          set -euo pipefail
          dts=web/wasm/AniraWeb.d.ts
          grep -oE '^  _[A-Za-z0-9_]+\(' "$dts" | sed -E 's/^  _//; s/\($//' | sort -u > "$RUNNER_TEMP/exported.txt"
          { cat abi/symbols-0.txt abi/symbols-draft.txt abi/symbols-emscripten.txt; printf 'malloc\nfree\n'; } \
            | sort -u > "$RUNNER_TEMP/expected.txt"
          missing=$(comm -13 "$RUNNER_TEMP/exported.txt" "$RUNNER_TEMP/expected.txt")
          extra=$(comm -23 "$RUNNER_TEMP/exported.txt" "$RUNNER_TEMP/expected.txt")
          if [ -n "$missing" ]; then
            echo "::error::AniraWeb.d.ts lacks entry points of the symbol lists:"
            echo "$missing"
          fi
          if [ -n "$extra" ]; then
            echo "::error::AniraWeb.d.ts exports names no symbol list has:"
            echo "$extra"
          fi
          [ -z "$missing" ] && [ -z "$extra" ]
          echo "the module exports exactly the $(wc -l < "$RUNNER_TEMP/expected.txt") names of the symbol lists"

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Use the npm version pinned via "packageManager" in web/package.json
      # so contributors and CI produce identical lockfile shapes.
      - name: enable corepack
        run: corepack enable

      - name: install js deps
        working-directory: web
        run: npm ci

      - name: build js package
        working-directory: web
        run: npm run build

  # The queue's required status for this workflow.
  result:
    name: web result
    needs: [build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.build.result }}" = "success" ] || exit 1
