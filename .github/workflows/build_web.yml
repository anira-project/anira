name: build_web

# The wasm build runs through the shared cmake-build-wasm action — the emsdk
# pin lives there, shared across tanh-lab repos. The JS/TS npm package build
# that follows is anira product code and stays here, in the same job, because
# it consumes the wasm build outputs.

on:
  workflow_dispatch:
  merge_group:
  pull_request:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # The committed C ABI files (headers, enums.ts, symbol lists, layout test) must
      # match abi/anira.yml; this workflow has no path filter, so every PR gets it.
      - name: check the generated C ABI files against abi/anira.yml
        run: |
          python3 -m pip install --user pyyaml
          python3 tools/abi/gen.py --repo . --check

      # emcc emits the .d.ts during the build (--emit-tsd), so the pin must
      # precede it.
      - name: pin global typescript for emscripten --emit-tsd
        run: |
          sudo npm i -g typescript@5.9
          which tsc
          tsc --version

      - name: build wasm
        uses: tanh-lab/ci-actions/cmake-build-wasm@v0.3.10
        with:
          PRESET: wasm-release

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Use the npm version pinned via "packageManager" in web/package.json
      # so contributors and CI produce identical lockfile shapes.
      - name: enable corepack
        run: corepack enable

      - name: install js deps
        working-directory: web
        run: npm ci

      - name: build js package
        working-directory: web
        run: npm run build

  # The queue's required status for this workflow.
  result:
    name: web result
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.build.result }}" = "success" ] || exit 1
