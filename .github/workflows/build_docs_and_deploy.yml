name: build_docs_and_deploy

on:
  # PR runs are stubs: only the result job reports (queue entry requires it);
  # the real jobs run in the merge queue.
  pull_request:
    branches:
      - main
  merge_group:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_docs:
    if: github.event_name != 'pull_request'
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    # One-leg matrix: the shared ci-actions branch on matrix.name.
    strategy:
      matrix:
        name: [Linux-x86_64]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.7
      - name: dependencies
        run: |
          sudo apt-get install -y doxygen graphviz
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.3.7
        with:
          BUILD_TYPE: Release
          CMAKE_BUILD_ARGS: "-DBUILD_SHARED_LIBS=ON -DANIRA_WITH_DOCS=ON"
          TARGETS: "sphinx-docs"
      - name: upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/sphinx/html

  deploy:
    needs: build_docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The queue's required status for this workflow.
  result:
    name: docs result
    needs: [build_docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: the real jobs run in the merge queue"; exit 0; }
          [ "${{ needs.build_docs.result }}" = "success" ] || exit 1
