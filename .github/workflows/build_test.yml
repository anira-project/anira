name: build_test

# Desktop build + test over the CI presets (CMakePresets.json) and the shared
# tanh-lab/ci-actions, pinned to a tag. The matrix lives in
# .github/build_test_matrix.json; the plan job selects the tier:
#   - pull_request        -> PR tier (the "pr": true legs — representative
#                            coverage that fits the free-runner concurrency
#                            caps; ~10 legs, 3 of them macOS)
#   - every other event   -> full tier (all legs, incl. the gcc and clang-cl
#     (push, dispatch,       coverage legs) — pushes are asynchronous, nobody
#     on_tag's call, ...)    blocks on them
# Backend sets ride on each leg's configure args on top of the platform preset.
# Windows builds MSVC-first: cl.exe under Ninja inside a vcvars environment,
# which is what lets sccache cache MSVC compiles (launchers are ignored by the
# Visual Studio generator); Windows-x86_64-clang covers clang-cl. Release
# builds carry no /Zi — keep it that way (and no PCH), or sccache stops
# caching cl silently.

on:
  workflow_call:
    inputs:
      tier:
        description: "Matrix tier: 'full' (default) or 'pr'"
        type: string
        default: "full"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # sccache speaks the retired v1 cache API without this and every write fails
  # read-only ("Cannot write to read-only storage" — the cause of the permanent
  # 0% hit rate); v2 became the only protocol in 2025.
  ACTIONS_CACHE_SERVICE_V2: "on"

# The event is part of the group so a dispatched or scheduled full run and a
# push run on the same ref never cancel each other. The name stays hardcoded
# (not ${{ github.workflow }}): when on_tag.yml calls this as a reusable
# workflow, github.workflow becomes "on_tag" — shared with the other reusable
# test workflow, so cancel-in-progress would cancel one of them.
concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fetch the pinned model fixtures (~1.7 GB) once and publish them as a single
  # cross-OS cache entry; the build jobs restore it instead of every job cloning
  # the repos at configure time. Only push runs seed: PR runs restore the default
  # branch's entry (Actions cache scoping), and tag runs skip — an entry saved
  # under a tag ref would be restorable by nothing else. On a miss nothing
  # breaks, the configure fetches the pins itself (extras/fetch-models.cmake);
  # for the same reason the build jobs carry no `needs:` on this job (the first
  # run per key misses everywhere by design — a hard dependency would serialize
  # the whole matrix behind the clone) and a seed failure never fails the run
  # (continue-on-error) — on_tag gates releases on this workflow's conclusion.
  seed_models_cache:
    name: seed the model-fixture cache
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore or create the cache entry
        id: models_cache
        uses: actions/cache@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: fetch the pinned model repositories
        if: steps.models_cache.outputs.cache-hit != 'true'
        run: cmake -P extras/fetch-models.cmake

  # Selects the tier and emits the matrix include-list — one source of truth in
  # .github/build_test_matrix.json, no skipped-job noise in the checks UI.
  plan:
    name: plan the matrix tier
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: select the tier
        id: tier
        run: |
          TIER="full"
          if [ "${{ github.event_name }}" = "pull_request" ]; then TIER="pr"; fi
          if [ -n "${{ inputs.tier }}" ]; then TIER="${{ inputs.tier }}"; fi
          echo "Tier: $TIER"
          echo "matrix=$(jq -c --arg tier "$TIER" '[ .[] | select($tier != "pr" or .pr == true) ]' .github/build_test_matrix.json)" >> "$GITHUB_OUTPUT"

  build_test:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # Job level: anira's backend integrity check queries the GitHub release
      # API with auth (avoids unauthenticated rate limits); degrades gracefully
      # if unset.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.1
      # The presets use Ninja, so cl.exe and its headers/libs must come from a
      # vcvars environment (x64, or native arm64 tools on windows-11-arm).
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.2.1
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: ${{ matrix.args }}
      - name: assert the backend linkage rule
        # Backend linkage follows BUILD_SHARED_LIBS (cmake/validate-options.cmake):
        # a shared anira cannot link the static-only ExecuTorch, a static anira not
        # the shared-only LibTorch. Every engines-on leg must therefore have
        # configured with the unsupported engine disabled and a warning saying so
        # (cmake-build keeps the configure output in configure.log).
        if: matrix.assert
        shell: bash
        run: |
          if [[ "${{ matrix.assert }}" == "shared" ]]; then
            grep -q "disabling ANIRA_WITH_EXECUTORCH" configure.log
          else
            grep -q "disabling ANIRA_WITH_LIBTORCH" configure.log
          fi
      - name: test
        uses: tanh-lab/ci-actions/cmake-test@v0.2.1
        with:
          PRESET: ${{ matrix.preset }}

  # The one status branch protection should require: green only when every
  # matrix leg of the selected tier succeeded. Per-leg names change with the
  # tier, so requiring them directly would leave PRs pending forever.
  result:
    name: build_test result
    needs: [plan, build_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "matrix result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
