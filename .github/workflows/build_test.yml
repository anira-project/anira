name: build_test

# Desktop build + test over the CI presets and the shared tanh-lab/ci-actions.
# The matrix lives in .github/build_test_matrix.json. Pull requests run the
# "pr": true subset with the fast tests; the merge queue (and on_tag's call)
# runs every leg with the full suite; pushes to main run nothing here — the
# queue already validated the identical tree (docs/ci-overhaul.md §3.6).
# Two constraints worth repeating:
# Windows must build under Ninja inside a vcvars environment (the VS generator
# ignores compiler launchers, so sccache would silently stop caching cl), and
# Release must stay free of /Zi and PCH for the same reason.

on:
  merge_group:
  workflow_call:
    inputs:
      tier:
        description: "Matrix tier: 'full' (default) or 'pr'"
        type: string
        default: "full"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

# The event is in the group so a dispatched full run and a push run on the same
# ref never cancel each other. The name stays hardcoded (not github.workflow):
# on_tag's reusable call would otherwise share a group with build_test_mobile.
concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits the tier's matrix include-list from .github/build_test_matrix.json.
  plan:
    name: plan (build_test)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: select the tier
        id: tier
        run: |
          TIER="full"
          if [ "${{ github.event_name }}" = "pull_request" ]; then TIER="pr"; fi
          if [ -n "${{ inputs.tier }}" ]; then TIER="${{ inputs.tier }}"; fi
          echo "Tier: $TIER"
          echo "matrix=$(jq -c --arg tier "$TIER" '[ .[] | select($tier != "pr" or .pr == true) ]' .github/build_test_matrix.json)" >> "$GITHUB_OUTPUT"

  build_test:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.2
      # Ninja needs cl.exe and its headers/libs from a vcvars environment.
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.2.2
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: ${{ matrix.args }}
      - name: assert the backend linkage rule
        # Every engines-on leg must have auto-disabled the engine its linkage
        # cannot carry (cmake/validate-options.cmake) — asserted on the
        # configure.log that cmake-build keeps.
        if: matrix.assert
        shell: bash
        run: |
          if [[ "${{ matrix.assert }}" == "shared" ]]; then
            grep -q "disabling ANIRA_WITH_EXECUTORCH" configure.log
          else
            grep -q "disabling ANIRA_WITH_LIBTORCH" configure.log
          fi
      - name: test
        uses: tanh-lab/ci-actions/cmake-test@v0.2.2
        with:
          PRESET: ${{ matrix.preset }}
          # PRs run the fast tests only; the heavy model-inference binaries
          # (test_handler, test_backends - labeled by binary) run in the queue.
          CTEST_ARGS: ${{ github.event_name == 'pull_request' && '-LE ''test_handler|test_backends''' || '' }}
      - name: test the x86_64 slice under Rosetta
        # Universal legs run the suite twice on one runner — an x86_64 process
        # spawns fat children as x86_64, so the second slice executes without a
        # second macOS job (docs/ci-overhaul.md §3.6).
        if: matrix.dualarch && github.event_name != 'pull_request'
        shell: bash
        run: |
          rc=0
          for t in test_utils test_scheduler test_backends test_handler; do
            arch -x86_64 "build/ci/${{ matrix.dualarch }}/test/$t" --gtest_brief=1 || rc=1
          done
          exit $rc

  # The one status branch protection should require — per-leg names change
  # with the tier, so requiring them directly would leave PRs pending forever.
  result:
    name: build_test result
    needs: [plan, build_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "matrix result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
