name: build_test

on:
  workflow_call:
  workflow_dispatch: # lets you run a build from github.com
  # Runs the workflow on all push events
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # sccache speaks the retired v1 cache API without this and every write fails
  # read-only ("Cannot write to read-only storage" — the cause of the permanent
  # 0% hit rate); v2 became the only protocol in 2025.
  ACTIONS_CACHE_SERVICE_V2: "on"

# When pushing new commits, cancel any workflows with the same name on that branch
# Hardcode the workflow name (not ${{ github.workflow }}): when on_tag.yml calls this
# as a reusable workflow, github.workflow becomes "on_tag" — shared with the other
# reusable test workflow, so cancel-in-progress would cancel one of them. A literal
# keeps the group distinct in both the standalone (PR/push) and reused (tag) cases.
concurrency:
  group: build_test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fetch the pinned model fixtures (~1.7 GB) once and publish them as a single
  # cross-OS cache entry; the build jobs restore it instead of every job cloning
  # the repos at configure time. Only push runs seed: PR runs restore the default
  # branch's entry (Actions cache scoping), and tag runs skip — an entry saved
  # under a tag ref would be restorable by nothing else. On a miss nothing
  # breaks, the configure fetches the pins itself (extras/fetch-models.cmake);
  # for the same reason the build jobs carry no `needs:` on this job (the first
  # run per key misses everywhere by design — a hard dependency would serialize
  # the whole matrix behind the clone) and a seed failure never fails the run
  # (continue-on-error) — on_tag gates releases on this workflow's conclusion.
  seed_models_cache:
    name: seed the model-fixture cache
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore or create the cache entry
        id: models_cache
        uses: actions/cache@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: fetch the pinned model repositories
        if: steps.models_cache.outputs.cache-hit != 'true'
        run: cmake -P extras/fetch-models.cmake

  build_test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include:
          # Every platform/arch is built both shared and static as its own runner.
          # `inference_engines` toggles LibTorch + ONNX Runtime + LiteRT together;
          # LibTorch is shared-only, so anira's CMake auto-disables it for static builds.
          # Per-leg `onnxruntime` / `litert` / `tflite` overrides cover the legacy TFLite
          # backend (mutually exclusive with LiteRT) — see the *-tflite-* legs below.
          - name: Linux-x86_64-no_inference_engines
            os: ubuntu-latest
            inference_engines: OFF
            shared: ON
          - name: Linux-x86_64-shared
            os: ubuntu-latest
            inference_engines: ON
            shared: ON
          - name: Linux-x86_64-static
            os: ubuntu-latest
            inference_engines: ON
            shared: OFF
          - name: Linux-arm64-shared
            os: ubuntu-24.04-arm
            inference_engines: ON
            shared: ON
          - name: Linux-arm64-static
            os: ubuntu-24.04-arm
            inference_engines: ON
            shared: OFF
          - name: Windows-x86_64-shared
            os: windows-latest
            inference_engines: ON
            shared: ON
          - name: Windows-x86_64-static
            os: windows-latest
            inference_engines: ON
            shared: OFF
          - name: Windows-arm64-shared
            os: windows-11-arm
            inference_engines: ON
            shared: ON
          - name: Windows-arm64-static
            os: windows-11-arm
            inference_engines: ON
            shared: OFF
          # x86_64 runs natively on the Intel runner image (macos-15-intel, free for
          # public repos until ~Aug 2027) — on the Apple-Silicon runners the same
          # test step took 2-4x longer under Rosetta. The universal legs stay on
          # Apple Silicon and cover the arm64 slice natively.
          - name: macOS-x86_64-shared
            os: macos-15-intel
            inference_engines: ON
            shared: ON
          - name: macOS-x86_64-static
            os: macos-15-intel
            inference_engines: ON
            shared: OFF
          - name: macOS-arm64-shared
            os: macOS-latest
            inference_engines: ON
            shared: ON
          - name: macOS-arm64-static
            os: macOS-latest
            inference_engines: ON
            shared: OFF
          - name: macOS-universal-shared
            os: macOS-latest
            inference_engines: ON
            shared: ON
          - name: macOS-universal-static
            os: macOS-latest
            inference_engines: ON
            shared: OFF
          # Legacy TFLite backend (ONNX + TFLite; LiteRT/LibTorch off since TFLite is
          # mutually exclusive with LiteRT). One x86_64 leg per desktop OS, shared+static.
          - name: Linux-x86_64-tflite-shared
            os: ubuntu-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: ON
          - name: Linux-x86_64-tflite-static
            os: ubuntu-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: OFF
          - name: macOS-arm64-tflite-shared
            os: macOS-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: ON
          - name: macOS-arm64-tflite-static
            os: macOS-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: OFF
          - name: Windows-x86_64-tflite-shared
            os: windows-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: ON
          - name: Windows-x86_64-tflite-static
            os: windows-latest
            inference_engines: OFF
            onnxruntime: ON
            tflite: ON
            shared: OFF

    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: setup
        uses: ./.github/actions/setup
      - name: build
        uses: ./.github/actions/build
        with:
          BUILD_TYPE: Release
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          # Backends resolve per-leg: explicit matrix override first, else the shared
          # `inference_engines` toggle, else OFF (TFLite defaults OFF — legacy, opt-in).
          CMAKE_BUILD_ARGS: "-DBUILD_SHARED_LIBS=${{ matrix.shared }} -DANIRA_WITH_TESTS=ON -DANIRA_WITH_LIBTORCH=${{ matrix.inference_engines }} -DANIRA_WITH_ONNXRUNTIME=${{ matrix.onnxruntime || matrix.inference_engines }} -DANIRA_WITH_LITERT=${{ matrix.litert || matrix.inference_engines }} -DANIRA_WITH_EXECUTORCH=${{ matrix.executorch || matrix.inference_engines }} -DANIRA_WITH_TFLITE=${{ matrix.tflite || 'OFF' }}"
      - name: assert the backend linkage rule
        # Backend linkage follows BUILD_SHARED_LIBS (cmake/validate-options.cmake): a
        # shared anira cannot link the static-only ExecuTorch, a static anira not the
        # shared-only LibTorch. Every leg that asks for the full engine set must
        # therefore have configured with the unsupported engine disabled and a
        # warning saying so (the configure output is kept by the build action).
        if: matrix.inference_engines == 'ON'
        shell: bash
        run: |
          if [[ "${{ matrix.shared }}" == "ON" ]]; then
            grep -q "disabling ANIRA_WITH_EXECUTORCH" configure.log
          else
            grep -q "disabling ANIRA_WITH_LIBTORCH" configure.log
          fi
      - name: test
        uses: ./.github/actions/test
        with:
          # Windows builds with the multi-config Visual Studio generator, where ctest
          # needs the configuration: without -C the gtest-discovered tests of that
          # configuration are not even listed (the legs used to pass with "No tests
          # were found") and the config-independent entries fail with "Test not
          # available without configuration". Harmless on single-config generators.
          # -j 4: gtest discovery registers one CTest entry per case, so the suite
          # parallelizes; the runners have 3-4 vCPUs. Tests that drive the build
          # tree carry a RESOURCE_LOCK (test/CMakeLists.txt).
          CTEST_ARGS: "-C Release -j 4"
