name: build_test

# Desktop build + test — the logic lives in tanh-lab/ci-actions' reusable
# build-test workflow; this file keeps only anira's facts (triggers, the matrix
# file, the models cache). Every leg runs the full test suite: pull requests
# build the "pr": true subset of .github/build_test_matrix.json, the merge
# queue (and on_tag's call) builds every leg, and pushes to main run nothing
# here — the queue already validated the identical tree.

on:
  merge_group:
  workflow_call:
    inputs:
      tier:
        description: "Matrix tier: 'full' (default) or 'pr'"
        type: string
        default: "full"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"
  pull_request:
    branches:
      - main
      - v3

# The event is in the group so a dispatched full run and a push run on the same
# ref never cancel each other. The name stays hardcoded (not github.workflow):
# on_tag's reusable call would otherwise share a group with build_test_mobile.
concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: build_test
    uses: tanh-lab/ci-actions/.github/workflows/build-test.yml@v0.3.10
    with:
      tier: ${{ inputs.tier || '' }}
      # PRs run the full test suite; the tiers differ only in WHICH LEGS run
      # (the pr flags in .github/build_test_matrix.json), not in which tests.
      models_cache_prefix: anira-models-v1
      models_hash_glob: extras/fetch-models.cmake
      models_cache_paths: |
        extras/models/hybrid-nn/GuitarLSTM
        extras/models/cnn/steerable-nafx
        extras/models/stateful-rnn/stateful-lstm
        extras/models/model-pool/example-models
        extras/models/third-party/ircam-acids/RAVE

  # The one status branch protection requires. It lives here, not only inside
  # the reusable workflow, because called jobs report under a prefixed name
  # ("build_test / build_test result") — this job keeps the exact context.
  result:
    name: build_test result
    needs: build_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The PR tier's backend coverage lives or dies with these two rows staying
      # "pr": true — the static leg is the only PR leg that builds ExecuTorch, the
      # tflite leg the only desktop TFLite one. What each leg actually builds is
      # already asserted by its own assert_grep and its tests; this only pins the
      # promotion so it cannot be dropped unnoticed.
      - name: pr tier keeps its backend legs
        run: |
          jq -e '[.[] | select(.pr == true) | .name]
                 | contains(["Linux-x86_64-static","Linux-x86_64-tflite-shared"])'             .github/build_test_matrix.json
      # uses: refs cannot reference a variable (GitHub resolves them before any
      # context exists), so single-point definition is impossible — this asserts
      # the next-best property: exactly one ci-actions version across the repo.
      - name: one ci-actions version repo-wide
        run: |
          test "$(grep -rho 'tanh-lab/ci-actions[^@]*@v[0-9.]*' .github/workflows/ | grep -o 'v[0-9.]*$' | sort -u | wc -l)" -eq 1
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
