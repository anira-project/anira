name: clang_tidy

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v3
    # No path filter: "clang_tidy result" reports on every pull request head, so
    # it can be a REQUIRED check (a required check that never reports blocks
    # queue entry forever, which is why the path-filtered version could not be
    # one, and why its sweep in the merge queue did not gate a merge). A pull
    # request checks only the .cpp files it changes, and one that changes none
    # skips the restore, the tool setup and the build: the job is a checkout
    # and one script. The merge queue always sweeps every source and, with the
    # result required, is the enforcement point. A full sweep of a branch before
    # the queue: run this workflow by hand (workflow_dispatch).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
      # What changes tidy's own verdicts sweeps: the rule set and this workflow
      # (it pins the tidy tool). Build files are not listed: the pattern meets
      # the pull request's whole diff on every push, so a CMakeLists.txt in it
      # would sweep every pull request that adds a source file, on every push.
      TIDY_SWEEP_PATTERN: '^\.clang-tidy$|^\.github/workflows/clang_tidy\.yml$'
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      # Depth 2: the pull request's merge commit with both parents, which is what
      # the changed-files selection of clang-tidy-check diffs (no token, no API).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The same selection clang-tidy-check makes below, run first so that a pull
      # request with nothing to check skips everything that costs time. `work` is
      # true on a sweep (the queue, a dispatch, the pattern) and when the list
      # holds a .cpp path; a false positive only builds for nothing.
      - uses: tanh-lab/ci-actions/changed-files@v0.3.15
        id: changed
        with:
          FULL_SWEEP_PATTERN: ${{ env.TIDY_SWEEP_PATTERN }}
      - name: anything to check?
        id: plan
        env:
          # Through the environment: the reason can carry a path of the pull request.
          WORK: ${{ steps.changed.outputs.sweep == 'true' || contains(steps.changed.outputs.files, '.cpp') }}
          REASON: ${{ steps.changed.outputs.reason }}
        run: |
          echo "work=$WORK" >> "$GITHUB_OUTPUT"
          echo "work=$WORK ($REASON)"
      # The clang-tidy preset enables tests, so the configure fetches the model
      # fixtures — restore them from the shared cache like the build workflows.
      - name: restore the model fixtures
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.15
        if: steps.plan.outputs.work == 'true'
      # clang-tidy needs a compile_commands.json, so the library is configured
      # and built first. The clang-tidy preset enables tests, the benchmark
      # fixture and all backends so every analysed translation unit compiles.
      - uses: tanh-lab/ci-actions/cmake-build@v0.3.15
        if: steps.plan.outputs.work == 'true'
        with:
          PRESET: clang-tidy
      # SOURCES excludes src/emscripten-wrappers/ because those translation
      # units are only built by the wasm presets (Emscripten toolchain) and are
      # therefore absent from this build's compilation database — and test/contracts/install/ (an external consumer project that only compiles against an installed prefix),
      # a separate consumer project built against an *installed* anira: it has no
      # compile command here either, and clang-tidy would guess one from a nearby
      # test file, which lacks the engine include directory its engine consumer
      # needs (build_install is what checks it).
      - uses: tanh-lab/ci-actions/clang-tidy-check@v0.3.15
        if: steps.plan.outputs.work == 'true'
        with:
          PRESET: clang-tidy
          SOURCES: "src/backends/ src/benchmark/ src/capi/ src/scheduler/ src/utils/ src/InferenceConfig.cpp src/InferenceHandler.cpp src/PrePostProcessor.cpp test/backends/ test/scheduler/ test/utils/ test/system/ test/support/ test/contracts/unload/ test/abi/ test/contracts/header_isolation.cpp test/contracts/test_EngineLinkage.cpp test/*.cpp"
          # Pull requests check the .cpp files they change; the queue and a
          # dispatch sweep SOURCES. A header or build change does not widen the
          # set: what it breaks in an untouched file fails in the queue.
          CHANGED_FILES_ONLY: "true"
          FULL_SWEEP_PATTERN: ${{ env.TIDY_SWEEP_PATTERN }}

  # The queue's required status for this workflow.
  result:
    name: clang_tidy result
    needs: [tidy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.tidy.result }}" = "success" ] || exit 1
