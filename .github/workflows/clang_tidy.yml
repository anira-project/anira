name: clang_tidy

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # Diff-based early warning: only when C++/build/config sources change does
    # the job even spawn; the merge queue always runs the full sweep and is the
    # enforcement point (this workflow's result is deliberately NOT a required
    # check — a path-skipped required check would block queue entry forever).
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".clang-tidy"
      - ".github/workflows/clang_tidy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The clang-tidy preset enables tests, so the configure fetches the model
      # fixtures — restore them from the shared cache like the build workflows.
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.10
      # clang-tidy needs a compile_commands.json, so the library is configured
      # and built first. The clang-tidy preset enables tests, the benchmark
      # fixture and all backends so every analysed translation unit compiles.
      - uses: tanh-lab/ci-actions/cmake-build@v0.3.10
        with:
          PRESET: clang-tidy
      # PRs analyse only their changed files; a header, CMake/tidy-config, or
      # this-workflow change (which pins the tidy tool) falls back to the full
      # sweep, and queue runs always sweep everything.
      - name: collect the PR's changed files
        id: diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
          if echo "$FILES" | grep -qE '\.(h|hpp)$|CMakeLists\.txt$|\.cmake$|CMakePresets\.json$|\.clang-tidy$|\.github/workflows/clang_tidy\.yml$'; then
            echo "A header, build/config file, or this workflow changed — full sweep."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'files<<ANIRA_EOF'
              echo "$FILES"
              echo 'ANIRA_EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      # SOURCES excludes src/emscripten-wrappers/ because those translation
      # units are only built by the wasm presets (Emscripten toolchain) and are
      # therefore absent from this build's compilation database — and test/contracts/install/ (an external consumer project that only compiles against an installed prefix),
      # a separate consumer project built against an *installed* anira: it has no
      # compile command here either, and clang-tidy would guess one from a nearby
      # test file, which lacks the engine include directory its engine consumer
      # needs (build_install is what checks it).
      - uses: tanh-lab/ci-actions/clang-tidy-check@v0.3.10
        with:
          PRESET: clang-tidy
          SOURCES: "src/backends/ src/benchmark/ src/scheduler/ src/utils/ src/InferenceConfig.cpp src/InferenceHandler.cpp src/PrePostProcessor.cpp test/backends/ test/scheduler/ test/utils/ test/system/ test/support/ test/contracts/unload/ test/contracts/header_isolation.cpp test/contracts/test_BackendLinkage.cpp test/*.cpp"
          # Empty on queue runs -> the action sweeps SOURCES.
          FILES: ${{ steps.diff.outputs.files }}

  # The queue's required status for this workflow.
  result:
    name: clang_tidy result
    needs: [tidy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.tidy.result }}" = "success" ] || exit 1
