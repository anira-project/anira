name: clang_tidy

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v3
    # Diff-based early warning: only when C++/build/config sources change does
    # the job even spawn, and a pull request run checks only the .cpp files it
    # changes; the merge queue always runs the full sweep and is the
    # enforcement point (this workflow's result is deliberately NOT a required
    # check — a path-skipped required check would block queue entry forever).
    # A full sweep of a branch before the queue: run this workflow by hand
    # (workflow_dispatch).
    paths:
      - "**.cpp"
      - "**.c"
      - "**.h"
      - "**.hpp"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".clang-tidy"
      - ".github/workflows/clang_tidy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      # Depth 2: the pull request's merge commit with both parents, which is what
      # the changed-files selection of clang-tidy-check diffs (no token, no API).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The clang-tidy preset enables tests, so the configure fetches the model
      # fixtures — restore them from the shared cache like the build workflows.
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.10
      # clang-tidy needs a compile_commands.json, so the library is configured
      # and built first. The clang-tidy preset enables tests, the benchmark
      # fixture and all backends so every analysed translation unit compiles.
      - uses: tanh-lab/ci-actions/cmake-build@v0.3.10
        with:
          PRESET: clang-tidy
      # SOURCES excludes src/emscripten-wrappers/ because those translation
      # units are only built by the wasm presets (Emscripten toolchain) and are
      # therefore absent from this build's compilation database — and test/contracts/install/ (an external consumer project that only compiles against an installed prefix),
      # a separate consumer project built against an *installed* anira: it has no
      # compile command here either, and clang-tidy would guess one from a nearby
      # test file, which lacks the engine include directory its engine consumer
      # needs (build_install is what checks it).
      # Pinned to the commit of tanh-lab/ci-actions' feat/tidy-changed-files for
      # the end-to-end run; re-pin to the release tag before this merges.
      - uses: tanh-lab/ci-actions/clang-tidy-check@f23f01d38139f7e0b0c30dafafa3cb09fadfba1e
        with:
          PRESET: clang-tidy
          SOURCES: "src/backends/ src/benchmark/ src/capi/ src/scheduler/ src/utils/ src/InferenceConfig.cpp src/InferenceHandler.cpp src/PrePostProcessor.cpp test/backends/ test/scheduler/ test/utils/ test/system/ test/support/ test/contracts/unload/ test/abi/ test/contracts/header_isolation.cpp test/contracts/test_BackendLinkage.cpp test/*.cpp"
          # Pull requests check the .cpp files they change; the queue and a
          # dispatch sweep SOURCES. A header change does not widen the set: what
          # it breaks in an untouched file fails in the queue, not on the pull
          # request. A build, preset or tidy-config change, or a change of this
          # workflow (it pins the tidy tool), re-judges every file: sweep.
          CHANGED_FILES_ONLY: "true"
          FULL_SWEEP_PATTERN: '^\.clang-tidy$'

  # The queue's required status for this workflow.
  result:
    name: clang_tidy result
    needs: [tidy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ needs.tidy.result }}" = "success" ] || exit 1
