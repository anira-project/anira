name: build_examples

# Builds every enabled example (JUCE/CLAP plugins, minimal-inference) per
# platform and linkage. Pull requests run the Linux and Windows shared legs;
# pushes to example-relevant PR bases and dispatches run everything.

on:
  merge_group:
  workflow_call:
  workflow_dispatch: # lets you run a build from github.com
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits the tier's matrix include-list (job-level `if` cannot see `matrix`).
  plan:
    name: plan (examples)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - name: select the tier
        id: tier
        shell: bash
        run: |
          LEGS='[{"name":"Linux-x86_64-shared","os":"ubuntu-latest","preset":"ci-tests-shared","pr":true},{"name":"Linux-x86_64-static","os":"ubuntu-latest","preset":"ci-tests-static"},{"name":"macOS-arm64-shared","os":"macOS-latest","preset":"ci-tests-shared"},{"name":"macOS-arm64-static","os":"macOS-latest","preset":"ci-tests-static"},{"name":"Windows-x86_64-shared","os":"windows-latest","preset":"windows-msvc-tests-shared","vcvars":"x64","pr":true},{"name":"Windows-x86_64-static","os":"windows-latest","preset":"windows-msvc-tests-static","vcvars":"x64"}]'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LEGS=$(echo "$LEGS" | jq -c '[ .[] | select(.pr == true) ]')
          fi
          echo "matrix=$(echo "$LEGS" | jq -c .)" >> "$GITHUB_OUTPUT"

  build_examples:
    name: examples / ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.2
      - name: add juce deps
        shell: bash
        run: |
          if [[ "${{ matrix.name }}" == Linux-* ]]; then
            sudo apt install libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev libasound2-dev libfontconfig1-dev libjack-jackd2-dev
            # Fix the juce bug with ft2build.h not found
            sudo ln -s /usr/include/freetype2/ft2build.h /usr/include/ft2build.h
            sudo ln -s /usr/include/freetype2/freetype /usr/include/freetype
          fi
      # Ninja needs cl.exe and its headers/libs from a vcvars environment.
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.2.2
        with:
          PRESET: ${{ matrix.preset }}
          # The exact example set depends on the active backends (libtorch is
          # auto-disabled for static builds), so build everything.
          CMAKE_BUILD_ARGS: "-DANIRA_WITH_EXAMPLES=ON -DANIRA_WITH_TESTS=OFF"
