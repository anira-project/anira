name: build_sanitizer

on:
  workflow_call:
  workflow_dispatch: # lets you run a build from github.com
  # Runs the workflow on all push events
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # sccache speaks the retired v1 cache API without this and every write fails
  # read-only ("Cannot write to read-only storage" — the cause of the permanent
  # 0% hit rate); v2 became the only protocol in 2025.
  ACTIONS_CACHE_SERVICE_V2: "on"

# When pushing new commits, cancel any workflows with the same name on that branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_rtsan:
    # Gates the ANIRA_REALTIME ([[clang::nonblocking]]) hot path — process/
    # push_data/pop_data/reset — at runtime, with no suppressions: logging from
    # real-time paths goes through thl::Logger::rt (lock-free, no syscalls), so
    # any allocation, lock, sleep, semaphore or stream syscall in a real-time
    # context fails the job. tanh-lib is built with TANH_WITH_RTSAN so its own
    # nonblocking annotations are checked in the same build.
    name: Check real-time safety with RTSan
    strategy:
      matrix:
        name: [Linux-x86_64]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      # RTSan (-fsanitize=realtime) instruments the ANIRA_REALTIME ([[clang::nonblocking]])
      # hot path and requires clang >= 20, so install it before configuring.
      - name: install clang 20
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
        with:
          CLANG_VERSION: "20"
      - name: setup
        uses: ./.github/actions/setup
      - name: build
        uses: ./.github/actions/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          BUILD_TYPE: Release
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CMAKE_BUILD_ARGS: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON -DANIRA_WITH_TESTS=ON -DANIRA_WITH_RTSAN=ON"
      - name: test
        uses: ./.github/actions/test
        with:
          CTEST_ARGS: "-j 4"
