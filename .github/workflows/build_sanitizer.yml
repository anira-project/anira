name: build_sanitizer

on:
  workflow_call:
  workflow_dispatch: # lets you run a build from github.com
  # Runs the workflow on all push events
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"

# When pushing new commits, cancel any workflows with the same name on that branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_rtsan:
    # Gates the ANIRA_REALTIME ([[clang::nonblocking]]) hot path — process/
    # push_data/pop_data/reset — at runtime. Of the two violations this job was
    # originally parked on, the moodycamel first-enqueue allocation was fixed in
    # v2.2.1 (explicit per-session producer tokens; verified clean under RTSan),
    # and the remaining stream-logging-from-the-audio-path class (RingBuffer
    # overflow log, new_data_submitted "no free inference queue" warning) is
    # suppressed via .github/rtsan-suppressions.supp until logging is moved off
    # the audio thread. Everything else — allocations, locks, sleeps, semaphore
    # syscalls in a real-time context — fails the job.
    name: Check real-time safety with RTSan
    strategy:
      matrix:
        name: [Linux-x86_64]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      # RTSan (-fsanitize=realtime) instruments the ANIRA_REALTIME ([[clang::nonblocking]])
      # hot path and requires clang >= 20, so install it before configuring.
      - name: install clang 20
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
        with:
          CLANG_VERSION: "20"
      - name: setup
        uses: ./.github/actions/setup
      - name: build
        uses: ./.github/actions/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          BUILD_TYPE: Release
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CMAKE_BUILD_ARGS: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON -DANIRA_WITH_TESTS=ON -DANIRA_WITH_RTSAN=ON"
      - name: test
        uses: ./.github/actions/test
        env:
          RTSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/rtsan-suppressions.supp"
