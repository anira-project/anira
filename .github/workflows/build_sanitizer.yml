name: build_sanitizer

on:
  # PR runs are stubs: only the result job reports (queue entry requires it);
  # the real jobs run in the merge queue.
  pull_request:
    branches:
      - main
  merge_group:
  workflow_call:
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_rtsan:
    if: github.event_name != 'pull_request'
    # Gates the ANIRA_REALTIME ([[clang::nonblocking]]) hot path — process/
    # push_data/pop_data/reset — at runtime, with no suppressions: logging from
    # real-time paths goes through thl::Logger::rt (lock-free, no syscalls), so
    # any allocation, lock, sleep, semaphore or stream syscall in a real-time
    # context fails the job. tanh-lib is built with TANH_WITH_RTSAN so its own
    # nonblocking annotations are checked in the same build.
    name: Check real-time safety with RTSan
    strategy:
      matrix:
        name: [Linux-x86_64]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      # RTSan (-fsanitize=realtime) requires clang >= 20.
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.3
        with:
          CLANG_VERSION: "20"
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.3.3
        with:
          PRESET: desktop-tests-rtsan
      - name: test
        uses: tanh-lab/ci-actions/cmake-test@v0.3.3
        with:
          PRESET: desktop-tests-rtsan

  # The queue's required status for this workflow.
  result:
    name: sanitizer result
    needs: [build_and_test_rtsan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: the real jobs run in the merge queue"; exit 0; }
          [ "${{ needs.build_and_test_rtsan.result }}" = "success" ] || exit 1
