name: on_tag

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

jobs:
  # Every artifact and the npm package are gated on the desktop and mobile
  # suites.
  build_test:
    uses: ./.github/workflows/build_test.yml
  build_test_mobile:
    uses: ./.github/workflows/build_test_mobile.yml
  build_release:
    needs: [build_test, build_test_mobile]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Every desktop platform/arch, both shared and static — mirroring what
        # build_test validates, so the published artifacts == the tested set
        # (same presets, same toolchains: clang on Linux/macOS, cl.exe under
        # Ninja+vcvars on Windows). Arch tokens match the anira-project/backends
        # naming (Linux=aarch64, Win/mac=arm64, plus macOS-universal). Static
        # auto-disables LibTorch (shared-only upstream), so a *-static zip ships
        # ONNX Runtime + LiteRT only.
        include:
          - { name: Linux-x86_64-shared,      os: ubuntu-latest,    preset: ci-tests-shared}
          - { name: Linux-x86_64-static,      os: ubuntu-latest,    preset: ci-tests-static}
          - { name: Linux-aarch64-shared,     os: ubuntu-24.04-arm, preset: ci-tests-shared}
          - { name: Linux-aarch64-static,     os: ubuntu-24.04-arm, preset: ci-tests-static}
          - { name: Windows-x86_64-shared,    os: windows-latest,   preset: windows-msvc-tests-shared, vcvars: x64 }
          - { name: Windows-x86_64-static,    os: windows-latest,   preset: windows-msvc-tests-static, vcvars: x64 }
          - { name: Windows-arm64-shared,     os: windows-11-arm,   preset: windows-msvc-tests-shared, vcvars: arm64 }
          - { name: Windows-arm64-static,     os: windows-11-arm,   preset: windows-msvc-tests-static, vcvars: arm64 }
          - { name: macOS-x86_64-shared,      os: macOS-latest,     preset: ci-tests-shared, arch: x86_64 }
          - { name: macOS-x86_64-static,      os: macOS-latest,     preset: ci-tests-static, arch: x86_64 }
          - { name: macOS-arm64-shared,       os: macOS-latest,     preset: ci-tests-shared}
          - { name: macOS-arm64-static,       os: macOS-latest,     preset: ci-tests-static}
          - { name: macOS-universal-shared,   os: macOS-latest,     preset: macos-universal-tests-shared}
          - { name: macOS-universal-static,   os: macOS-latest,     preset: macos-universal-tests-static}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.5
      # Ninja needs cl.exe and its headers/libs from a vcvars environment.
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.3.5
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: "-DANIRA_WITH_TESTS=OFF -DANIRA_WITH_INSTALL=ON ${{ matrix.arch && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.arch) || '' }}"
      - name: resolve the build directory
        id: bdir
        uses: tanh-lab/ci-actions/preset-binary-dir@v0.3.5
        with:
          PRESET: ${{ matrix.preset }}
      - name: install
        id: install
        uses: ./.github/actions/install
        with:
          BUILD_TYPE: Release
          BUILD_DIR: ${{ steps.bdir.outputs.BUILD_DIR }}
          PROJECT_NAME: anira
          DEV_ID_APP_CERT: ${{ secrets.DEV_ID_APP_CERT }}
          DEV_ID_APP_PWD: ${{ secrets.DEV_ID_APP_PWD }}
          DEV_ID_APP: ${{ secrets.DEV_ID_APP }}

  # iOS ships as a code-signed xcframework rather than the find_package install tree
  # (an .xcframework links from both CMake and Xcode). anira links the backends in
  # statically, so the consumer also needs their iOS xcframeworks — they are bundled
  # alongside. The zip is published with the other release assets via the */*.zip glob.
  build_release_ios:
    needs: [build_test, build_test_mobile]
    name: iOS-xcframework
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }} # lets anira's backend integrity check avoid API rate limits
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: install deps
        run: brew install ninja
      - name: import certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.DEV_ID_APP_CERT }}
          p12-password: ${{ secrets.DEV_ID_APP_PWD }}
      - name: build + sign anira.xcframework
        id: xcf
        env:
          IDENTITY: ${{ secrets.DEV_ID_APP }}
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          PRODUCT="anira-${VERSION}-iOS-xcframework"
          OUT="artefacts/${PRODUCT}"
          # A published xcframework must be Developer-ID signed; fail loudly rather than
          # let the script fall back to an ad-hoc signature on a missing/empty secret.
          if [ -z "$IDENTITY" ]; then
            echo "::error::DEV_ID_APP secret is empty — refusing to publish an ad-hoc-signed xcframework"; exit 1
          fi
          ANIRA_CODESIGN_IDENTITY="$IDENTITY" bash .github/scripts/build_ios_xcframework.sh "$OUT"
          # Bundle the backend iOS xcframeworks anira's static build links against, and
          # assert at least one was copied (a static anira.xcframework alone won't link).
          find modules -type d -path '*iOS-xcframework/*.xcframework' -prune -exec cp -R {} "$OUT/" \;
          count=$(find "$OUT" -maxdepth 1 -name '*.xcframework' | grep -vc 'anira.xcframework' || true)
          if [ "$count" -lt 1 ]; then
            echo "::error::no backend xcframeworks bundled into $OUT — consumers could not link"; exit 1
          fi
          (cd artefacts && zip -vr "${PRODUCT}.zip" "${PRODUCT}/" -x "*.DS_Store")
          echo "PRODUCT=${PRODUCT}" >> "$GITHUB_OUTPUT"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.xcf.outputs.PRODUCT }}.zip
          path: artefacts/${{ steps.xcf.outputs.PRODUCT }}.zip

  # Android ships ONE bundle covering every ABI — the CMake/NDK parallel to the iOS
  # xcframework. Each ABI is a complete relocatable find_package tree (.a + headers +
  # aniraConfig.cmake) under <abi>/; a consumer points find_package at
  # <bundle>/${ANDROID_ABI}, so it auto-selects via the NDK's own variable (no Gradle,
  # no prefab). Static, like the iOS slices.
  build_release_android:
    needs: [build_test, build_test_mobile]
    name: Android
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }} # lets anira's backend integrity check avoid API rate limits
      ANDROID_PLATFORM: android-24
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build + install all ABIs into one bundle
        id: pkg
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          PRODUCT="anira-${VERSION}-Android-static"  # static find_package trees per ABI
          for ABI in arm64-v8a x86_64; do
            cmake -B "build-${ABI}" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI="${ABI}" -DANDROID_PLATFORM=$ANDROID_PLATFORM \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DANIRA_WITH_LIBTORCH=OFF -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF \
              -DANIRA_WITH_INSTALL=ON -DCMAKE_INSTALL_PREFIX="artefacts/${PRODUCT}/${ABI}"
            cmake --build "build-${ABI}" --target install --parallel 4
            # The backend archives ship every ABI; drop the sibling ABIs from this
            # tree's lib/ (by exact ABI name, so lib/cmake and libanira.a are untouched).
            for OTHER in arm64-v8a armeabi-v7a x86 x86_64; do
              [ "$OTHER" != "$ABI" ] && rm -rf "artefacts/${PRODUCT}/${ABI}/lib/${OTHER}"
            done
          done
          (cd artefacts && zip -qr "${PRODUCT}.zip" "${PRODUCT}/")
          echo "PRODUCT=${PRODUCT}" >> "$GITHUB_OUTPUT"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.PRODUCT }}.zip
          path: artefacts/${{ steps.pkg.outputs.PRODUCT }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    needs:
      - build_release
      - build_release_ios
      - build_release_android
    steps:
    - name: Get Artifacts
      uses: actions/download-artifact@v4
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          */*.zip

  # npm, gated like every other release artifact. Trusted Publishing (OIDC):
  # no NPM_TOKEN — npm >= 11.5.1 exchanges the GitHub OIDC token for publish
  # credentials and emits provenance automatically.
  publish_npm:
    name: npm publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_test, build_test_mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the npm OIDC trusted-publishing handshake
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      # emcc emits the .d.ts during the build (--emit-tsd), so the pin must
      # precede it.
      - name: pin global typescript for emscripten --emit-tsd
        run: |
          sudo npm i -g typescript@5.9
          tsc --version
      - name: build wasm
        uses: tanh-lab/ci-actions/cmake-build-wasm@v0.3.5
        with:
          PRESET: wasm-release
      - name: setup node
        uses: actions/setup-node@v5
        with:
          # Node 24 ships npm >= 11, required for the npm OIDC
          # trusted-publishing handshake; npm 10 authenticates anonymously and
          # the publish fails with a misleading E404.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # Use the npm version pinned via "packageManager" in web/package.json
      # so contributors and CI produce identical lockfile shapes.
      - name: enable corepack
        run: corepack enable
      - name: install js deps
        working-directory: web
        run: npm ci
      - name: derive version + dist-tag
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            tag="next"
          else
            tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$tag"   >> "$GITHUB_OUTPUT"
      - name: stamp package version
        working-directory: web
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: build js package
        working-directory: web
        run: npm run build
      - name: npm publish
        working-directory: web
        run: |
          npm --version   # must be >= 11.5.1 for OIDC trusted publishing
          npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"
      
