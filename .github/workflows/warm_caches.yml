name: warm_caches

# The push-to-main cache warmer — the logic lives in
# tanh-lab/ci-actions' reusable warm-caches workflow (build-only legs plus the
# model-fixture seed); this file keeps only anira's legs and cache facts. See
# the reusable workflow's header for why warming must happen on main's scope.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: warm_caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: warm
    uses: tanh-lab/ci-actions/.github/workflows/warm-caches.yml@v0.3.4
    with:
      # One build-only leg per platform family (the PR-tier presets), so PR and
      # queue runs restore warm compile caches from main's scope.
      warm_matrix: >-
        [{"name":"Linux-x86_64","os":"ubuntu-latest","preset":"ci-tests-shared",
          "args":"-DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"},
         {"name":"Windows-x86_64","os":"windows-latest","preset":"windows-msvc-tests-shared","vcvars":"x64",
          "args":"-DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"},
         {"name":"macOS-universal","os":"macOS-latest","preset":"macos-universal-tests-shared",
          "args":"-DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"}]
      models_cache_prefix: anira-models-v1
      models_hash_glob: extras/fetch-models.cmake
      models_cache_paths: |
        extras/models/hybrid-nn/GuitarLSTM
        extras/models/cnn/steerable-nafx
        extras/models/stateful-rnn/stateful-lstm
        extras/models/model-pool/example-models
        extras/models/third-party/ircam-acids/RAVE
      fetch_command: cmake -P extras/fetch-models.cmake
