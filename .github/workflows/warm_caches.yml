name: warm_caches

# The only push-to-main workflow besides docs — it runs BUILDS, not tests (the
# merge queue already validated the identical tree). It exists because Actions
# caches are branch-scoped: entries written by queue or PR runs are not
# restorable elsewhere, so warm sccache objects and the model-fixture entry
# must be produced on main's scope or every run starts cold.

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

concurrency:
  group: warm_caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fetches the pinned model fixtures once and publishes them as a single
  # cross-OS cache entry every configuring job restores. On a miss nothing
  # breaks — the configure fetches the pins itself (extras/fetch-models.cmake).
  seed_models_cache:
    name: seed the model-fixture cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore or create the cache entry
        id: models_cache
        uses: actions/cache@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: fetch the pinned model repositories
        if: steps.models_cache.outputs.cache-hit != 'true'
        run: cmake -P extras/fetch-models.cmake

  # One build-only leg per platform family (the PR-tier presets), so PR and
  # queue runs restore warm compile caches from main's scope.
  warm:
    name: warm / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-latest
            preset: ci-tests-shared
          - name: Windows-x86_64
            os: windows-latest
            preset: windows-msvc-tests-shared
            vcvars: x64
          - name: macOS-universal
            os: macOS-latest
            preset: macos-universal-tests-shared
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.2
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.2.2
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: "-DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"
