name: coverage (Codecov metric, not a gate)

# Full-suite coverage — the pipeline is tanh-lab/ci-actions' reusable coverage
# workflow; this file keeps anira's facts.
#
# A coverage *dip* is still information and never a merge blocker: codecov.yml
# turns the project and patch statuses off, so no number Codecov computes can
# fail anything. What this workflow's own success reports is different — whether
# the pipeline still works at all: the instrumented build links, the suite
# passes, llvm-profdata can merge the profiles and llvm-cov can export them.
# That is a real breakage and it does belong in the queue. It used to run only
# on push to main, so a change to the preset it builds (CMakePresets.json is not
# in the path filter below either) first executed after merging, and landed a
# red main.

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  # Self-validating: runs on a PR when this workflow, or the preset it builds,
  # changes. Dormant on every other PR per the tier policy — the queue is where
  # it runs for everything else.
  pull_request:
    paths:
      - ".github/workflows/coverage.yml"
      - "CMakePresets.json"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three legs, merged by Codecov into one report: llvm-cov only sees files
  # compiled into the uploaded binaries. The shared leg misses ExecuTorch
  # (static-only) and TFLite; the static leg adds ExecuTorch (paired with the
  # pre-isolated LiteRT — combining it with TFLite silently auto-disables
  # ExecuTorch, see cmake/validate-options.cmake); a small shared leg adds
  # TFLite. Wasm-only and benchmark sources are excluded in codecov.yml.
  coverage:
    name: coverage / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared-litert
            args: "-DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"
          - name: static-executorch
            args: "-DBUILD_SHARED_LIBS=OFF -DANIRA_WITH_LIBTORCH=ON -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_EXECUTORCH=ON -DANIRA_WITH_TFLITE=OFF"
          - name: shared-tflite
            args: "-DANIRA_WITH_LIBTORCH=OFF -DANIRA_WITH_ONNXRUNTIME=OFF -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_EXECUTORCH=OFF -DANIRA_WITH_TFLITE=ON"
    uses: tanh-lab/ci-actions/.github/workflows/coverage.yml@v0.3.10
    permissions:
      contents: read
      id-token: write # Codecov's tokenless OIDC upload
    with:
      preset: ci-tests-coverage
      build_args: ${{ matrix.args }}
      lib_pattern: "libanira.so*"
      models_cache_prefix: anira-models-v1
      models_hash_glob: extras/fetch-models.cmake
      models_cache_paths: |
        extras/models/hybrid-nn/GuitarLSTM
        extras/models/cnn/steerable-nafx
        extras/models/stateful-rnn/stateful-lstm
        extras/models/model-pool/example-models
        extras/models/third-party/ircam-acids/RAVE

  # The single status the merge queue can require: one job that is green only if
  # every leg is. Matches the "<name> result" convention of the other workflows.
  result:
    name: coverage result
    if: always()
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.coverage.result }}"
          [ "${{ needs.coverage.result }}" = "success" ] || exit 1
