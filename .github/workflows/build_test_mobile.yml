name: build_test_mobile

# Mobile build + test. The desktop matrix lives in build_test.yml; mobile is
# split out because it cross-compiles and runs the suite on a simulator/emulator.
# Each per-component gtest binary (test_utils, test_scheduler, test_backends,
# test_handler) is launched once per target instead of one launch per case.
#
# Backend coverage (LibTorch has no mobile build, so it is never enabled here):
# ONE iOS job runs the sets sequentially — ONNX+LiteRT (device build + simulator
# tests), TFLite alone (mutually exclusive with LiteRT; collides with ONNX on
# iOS; simulator tests), no-backend (build) — with a single simulator boot: the
# 5-concurrent macOS cap is the scarce resource (docs/ci-overhaul.md §3.6).
# Android covers the sets as separate Linux jobs; pull requests run only the
# ONNX+LiteRT shared leg.

on:
  merge_group:
  schedule:
    # Weekly full-tier run (plan §3.6): scheduled events select the full matrix.
    - cron: "0 3 * * 1"
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

# Hardcoded name (not github.workflow): on_tag's reusable call would otherwise
# share a group with build_test; the event keeps dispatched and push runs apart.
concurrency:
  group: build_test_mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-latest # Apple Silicon -> arm64 device + arm64 simulator slices
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
      IOS_FLAGS: >-
        -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_SHARED_LIBS=OFF
        -DANIRA_WITH_LIBTORCH=OFF
      ONNX_LITERT: "-DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF"
      TFLITE: "-DANIRA_WITH_ONNXRUNTIME=OFF -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_TFLITE=ON -DANIRA_WITH_EXECUTORCH=OFF"
      NO_BACKEND: "-DANIRA_WITH_ONNXRUNTIME=OFF -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true

      - name: install deps
        run: brew install ninja

      - name: cache the build
        uses: mozilla-actions/sccache-action@v0.0.8

      # Device (arm64) — library only: wiring check, nothing runs.
      - name: build device library (onnx-litert)
        run: |
          cmake -B build-ios-device ${IOS_FLAGS} -DCMAKE_OSX_SYSROOT=iphoneos ${ONNX_LITERT}
          cmake --build build-ios-device --parallel 4

      - name: build simulator tests (onnx-litert)
        run: |
          cmake -B build-ios-sim ${IOS_FLAGS} -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 ${ONNX_LITERT} -DANIRA_WITH_TESTS=ON
          cmake --build build-ios-sim --parallel 4

      - name: build simulator tests (tflite)
        run: |
          cmake -B build-ios-sim-tflite ${IOS_FLAGS} -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 ${TFLITE} -DANIRA_WITH_TESTS=ON
          cmake --build build-ios-sim-tflite --parallel 4

      - name: build simulator library (no-backend)
        run: |
          cmake -B build-ios-sim-nobackend ${IOS_FLAGS} -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 ${NO_BACKEND}
          cmake --build build-ios-sim-nobackend --parallel 4

      - name: run tests on the simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" \
                 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -1)
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # The simulator shares the host filesystem, so the baked model paths
          # resolve as-is; failures are collected so one run reports every suite.
          rc=0
          for build in build-ios-sim build-ios-sim-tflite; do
            for t in test_utils test_scheduler test_backends test_handler; do
              xcrun simctl spawn "$UDID" "$PWD/$build/test/$t.app/$t" --gtest_brief=1 || rc=1
            done
          done
          exit $rc

  # Emits the tier's matrix include-list (job-level `if` cannot see `matrix`).
  plan:
    name: plan (mobile)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - name: select the tier
        id: tier
        shell: bash
        run: |
          LEGS='[{"name":"onnx-litert-shared","shared":"ON","pr":true,"backends":"-DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF"},{"name":"onnx-litert-static","shared":"OFF","backends":"-DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=ON -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF"},{"name":"tflite-shared","shared":"ON","backends":"-DANIRA_WITH_ONNXRUNTIME=OFF -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_TFLITE=ON -DANIRA_WITH_EXECUTORCH=OFF"},{"name":"no-backend-shared","shared":"ON","backends":"-DANIRA_WITH_ONNXRUNTIME=OFF -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_TFLITE=OFF -DANIRA_WITH_EXECUTORCH=OFF"}]'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LEGS=$(echo "$LEGS" | jq -c '[ .[] | select(.pr == true) ]')
          fi
          echo "matrix=$(echo "$LEGS" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android: per backend set + linkage, build arm64-v8a (build-only; no
  # accelerated arm emulator on x86 CI) and x86_64, then run the x86_64 suite on
  # a hardware-accelerated emulator. Pull requests run the onnx-litert-shared
  # leg only.
  # ---------------------------------------------------------------------------
  android:
    name: Android-${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ANDROID_PLATFORM: android-24
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: restore the model fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            extras/models/hybrid-nn/GuitarLSTM
            extras/models/cnn/steerable-nafx
            extras/models/stateful-rnn/stateful-lstm
            extras/models/model-pool/example-models
            extras/models/third-party/ircam-acids/RAVE
          key: anira-models-v1-${{ hashFiles('extras/fetch-models.cmake') }}
          enableCrossOsArchive: true

      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: cache the build
        uses: mozilla-actions/sccache-action@v0.0.8

      # arm64-v8a: build the full test executables to verify they compile + link
      # for the ABI we ship most. Not run here (no accelerated arm emulator on an
      # x86 host); the x86_64 emulator below provides the execution coverage.
      - name: build arm64-v8a
        run: |
          cmake -B build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DANIRA_WITH_LIBTORCH=OFF ${{ matrix.backends }} \
            -DANIRA_WITH_TESTS=ON
          cmake --build build-arm64 --parallel 4

      # x86_64: model paths pointed at the on-device staging dir so the binaries
      # + JSON configs reference where the model tree is pushed.
      - name: build x86_64
        run: |
          cmake -B build-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DANIRA_WITH_LIBTORCH=OFF ${{ matrix.backends }} \
            -DANIRA_WITH_TESTS=ON \
            -DANIRA_EXTRAS_MODELS_DIR=/data/local/tmp/anira/models
          cmake --build build-x86_64 --parallel 4

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run x86_64 suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # android-emulator-runner runs each line of an inline script in its own
          # shell, so the staging + run logic lives in one committed script where
          # the variables persist.
          script: bash .github/scripts/android_emulator_test.sh
