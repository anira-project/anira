name: build_install

# Install-tree completeness: build anira with ANIRA_WITH_INSTALL=ON, install it
# into a fresh prefix and build + run test/install (an external project using
# find_package(anira)) against that prefix. Catches headers, exported targets or
# dependencies (tanh::Core, backends) missing from what `cmake --install`
# produces — the regular jobs only ever link against the build tree.
# Pull requests run the Linux legs; pushes run everything. macOS runs shared and
# static sequentially in one job (the 5-concurrent macOS cap, ci-overhaul §3.6).

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"

concurrency:
  group: build_install-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits the tier's matrix include-list (job-level `if` cannot see `matrix`).
  plan:
    name: plan (install)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - name: select the tier
        id: tier
        shell: bash
        run: |
          LEGS='[{"name":"Linux-x86_64-shared","os":"ubuntu-latest","shared":"ON","pr":true},{"name":"Linux-x86_64-static","os":"ubuntu-latest","shared":"OFF","pr":true},{"name":"Windows-x86_64-shared","os":"windows-latest","shared":"ON"},{"name":"Windows-x86_64-static","os":"windows-latest","shared":"OFF"}]'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LEGS=$(echo "$LEGS" | jq -c '[ .[] | select(.pr == true) ]')
          fi
          echo "matrix=$(echo "$LEGS" | jq -c .)" >> "$GITHUB_OUTPUT"

  build_install:
    name: install / ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # ONNX Runtime stays on so the backend part of the install tree is
        # covered; the other engines are exercised by on_tag.yml.
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }} # authenticated backend integrity check
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.2.2
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.2.2
        with:
          BUILD_TYPE: Release
          TARGETS: anira
          CMAKE_BUILD_ARGS: "-DBUILD_SHARED_LIBS=${{ matrix.shared }} -DANIRA_WITH_INSTALL=ON -DANIRA_WITH_TESTS=OFF -DANIRA_WITH_LIBTORCH=OFF -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_EXECUTORCH=OFF"
      # The prefix is passed at install time rather than through CMAKE_BUILD_ARGS:
      # the build action expands that string unquoted in bash, which strips the
      # backslashes out of a Windows workspace path.
      - name: install
        shell: bash
        run: |
          PREFIX="$PWD/prefix"
          if command -v cygpath > /dev/null; then PREFIX="$(cygpath -m "$PREFIX")"; fi
          cmake --install build --config Release --prefix "$PREFIX"
          echo "::group::install tree"
          find prefix -type f | sort
          echo "::endgroup::"
      - name: build and run the consumer against the prefix
        shell: bash
        run: |
          PREFIX="$PWD/prefix"
          if command -v cygpath > /dev/null; then PREFIX="$(cygpath -m "$PREFIX")"; fi
          # test/install builds two consumers — anira alone, and one that calls ONNX
          # Runtime itself through anira::onnxruntime — and asserts at configure
          # time that the engine header is unreachable without that target.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S test/install -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
            cmake --build build-consumer --config Release --parallel
            # Every DLL (anira, the engines, tanh_core) installs to bin/; only bin/ goes
            # on PATH so that the run also proves the layout.
            PATH="$PWD/prefix/bin:$PATH" ./build-consumer/Release/consumer.exe
            PATH="$PWD/prefix/bin:$PATH" ./build-consumer/Release/consumer_engine.exe
          else
            cmake -S test/install -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
            cmake --build build-consumer --parallel
            ./build-consumer/consumer
            ./build-consumer/consumer_engine
            # The plugin-shaped engine consumer must export no engine symbol (the
            # InstallConsumer CTest, test/install/run-install-test.cmake, runs the
            # same check).
            if nm -D --defined-only build-consumer/consumer_engine_module.so | grep -E "_ZN3Ort|_ZN11onnxruntime|[ _]Ort[A-Z]|OrtGetApiBase"; then
              echo "consumer_engine_module exports engine symbols"; exit 1
            fi
          fi

  # One macOS runner does shared and static sequentially (raw cmake over the ci
  # presets — their distinct binaryDirs keep the two configurations apart).
  build_install_macos:
    name: install / macOS-arm64
    if: github.event_name != 'pull_request'
    runs-on: macOS-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: install deps
        run: brew install ninja
      - name: cache the build
        uses: mozilla-actions/sccache-action@v0.0.8
      - name: build, install, and run the consumers (shared + static)
        shell: bash
        run: |
          set -e
          for cfg in shared static; do
            if [ "$cfg" = "shared" ]; then SHARED=ON; else SHARED=OFF; fi
            cmake --preset "ci-tests-$cfg" \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DANIRA_WITH_TESTS=OFF -DANIRA_WITH_INSTALL=ON \
              -DANIRA_WITH_LIBTORCH=OFF -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_EXECUTORCH=OFF
            cmake --build "build/ci/tests-$cfg" --target anira --parallel 4
            PREFIX="$PWD/prefix-$cfg"
            cmake --install "build/ci/tests-$cfg" --prefix "$PREFIX"
            cmake -S test/install -B "build-consumer-$cfg" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
            cmake --build "build-consumer-$cfg" --parallel
            "./build-consumer-$cfg/consumer"
            "./build-consumer-$cfg/consumer_engine"
            if nm -gU "build-consumer-$cfg/consumer_engine_module.so" | grep -E "_ZN3Ort|_ZN11onnxruntime|[ _]Ort[A-Z]|OrtGetApiBase"; then
              echo "consumer_engine_module exports engine symbols"; exit 1
            fi
          done
