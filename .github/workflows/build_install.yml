name: build_install

# Install-tree completeness: build anira with ANIRA_WITH_INSTALL=ON, install it
# into a fresh prefix and build + run test/install (an external project using
# find_package(anira)) against that prefix. Catches headers, exported targets or
# dependencies (tanh::Core, backends) missing from what `cmake --install`
# produces — the regular jobs only ever link against the build tree.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: build_install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_install:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime stays on so the backend part of the install tree is
          # covered; the other engines are exercised by on_tag.yml.
          - name: Linux-x86_64-shared
            os: ubuntu-latest
            shared: ON
          - name: Linux-x86_64-static
            os: ubuntu-latest
            shared: OFF
          - name: macOS-arm64-shared
            os: macOS-latest
            shared: ON
          - name: macOS-arm64-static
            os: macOS-latest
            shared: OFF
          - name: Windows-x86_64-shared
            os: windows-latest
            shared: ON
          - name: Windows-x86_64-static
            os: windows-latest
            shared: OFF
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: setup
        uses: ./.github/actions/setup
      - name: build
        uses: ./.github/actions/build
        with:
          BUILD_TYPE: Release
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          TARGETS: (anira)
          CMAKE_BUILD_ARGS: "-DBUILD_SHARED_LIBS=${{ matrix.shared }} -DANIRA_WITH_INSTALL=ON -DANIRA_WITH_TESTS=OFF -DANIRA_WITH_LIBTORCH=OFF -DANIRA_WITH_ONNXRUNTIME=ON -DANIRA_WITH_LITERT=OFF -DANIRA_WITH_EXECUTORCH=OFF"
      # The prefix is passed at install time rather than through CMAKE_BUILD_ARGS:
      # the composite build action expands that string unquoted in bash, which
      # strips the backslashes out of a Windows workspace path.
      - name: install
        shell: bash
        run: |
          PREFIX="$PWD/prefix"
          if command -v cygpath > /dev/null; then PREFIX="$(cygpath -m "$PREFIX")"; fi
          cmake --install build --config Release --prefix "$PREFIX"
          echo "::group::install tree"
          find prefix -type f | sort
          echo "::endgroup::"
      - name: build and run the consumer against the prefix
        shell: bash
        run: |
          PREFIX="$PWD/prefix"
          if command -v cygpath > /dev/null; then PREFIX="$(cygpath -m "$PREFIX")"; fi
          # test/install builds two consumers — anira alone, and one that calls ONNX
          # Runtime itself through anira::onnxruntime — and asserts at configure
          # time that the engine header is unreachable without that target.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S test/install -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
            cmake --build build-consumer --config Release --parallel
            # Every DLL (anira, the engines, tanh_core) installs to bin/; only bin/ goes
            # on PATH so that the run also proves the layout.
            PATH="$PWD/prefix/bin:$PATH" ./build-consumer/Release/consumer.exe
            PATH="$PWD/prefix/bin:$PATH" ./build-consumer/Release/consumer_engine.exe
          else
            cmake -S test/install -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX"
            cmake --build build-consumer --parallel
            ./build-consumer/consumer
            ./build-consumer/consumer_engine
            # The plugin-shaped engine consumer must export no engine symbol (the
            # InstallConsumer CTest, test/install/run-install-test.cmake, runs the
            # same check).
            if [[ "$RUNNER_OS" == "macOS" ]]; then NM="nm -gU"; else NM="nm -D --defined-only"; fi
            if $NM build-consumer/consumer_engine_module.so | grep -E "_ZN3Ort|_ZN11onnxruntime|[ _]Ort[A-Z]|OrtGetApiBase"; then
              echo "consumer_engine_module exports engine symbols"; exit 1
            fi
          fi
